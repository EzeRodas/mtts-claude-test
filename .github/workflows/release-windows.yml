name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 (UCRT64) for libespeak-ng + MBROLA
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            autotools
            git
            python
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-toolchain

      - name: Build libespeak-ng.dll (with in-memory MBROLA) and espeak-ng-data
        shell: msys2 {0}
        run: bash Engines/Mbrola/build-native.sh

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version number
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}".TrimStart('v')
          } else {
            $ver = "1.0.0-dev"
          }
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Publish Desktop GUI (Native AOT)
        run: dotnet publish MoonTTS.Avalonia/MoonTTS.Avalonia.csproj -c Release -r win-x64 -o dist/app

      - name: Publish CLI & Daemon (Native AOT)
        run: dotnet publish MoonTTS.CLI/MoonTTS.CLI.csproj -c Release -r win-x64 -o dist/app

      - name: Publish Kokoro Engine Worker (Native AOT)
        run: dotnet publish Engines/Kokoro/MoonTTS.Engine.Kokoro.csproj -c Release -r win-x64 -o dist/engines/Kokoro

      - name: Publish Mbrola Engine Worker (Native AOT)
        run: dotnet publish Engines/Mbrola/MoonTTS.Engine.Mbrola.csproj -c Release -r win-x64 -o dist/engines/Mbrola

      - name: Publish Kitten Engine Worker (Native AOT)
        run: dotnet publish Engines/Kitten/MoonTTS.Engine.Kitten.csproj -c Release -r win-x64 -o dist/engines/Kitten

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.VERSION }}" installer.iss

      - name: Upload Installer as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoonTTS-Windows-Installer
          path: dist/MoonTTS-Setup-*.exe

      - name: Attach Installer to GitHub Release (on tag push)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MoonTTS-Setup-*.exe
          generate_release_notes: true
